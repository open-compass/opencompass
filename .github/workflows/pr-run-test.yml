name: pr_run_test

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README_zh-CN.md'
      - 'docs/**'
      - 'configs/**'
      - 'tools/**'
  workflow_dispatch:
  schedule:
    - cron:  '56 22 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONDA_ENV: pr_regression
  HF_DATASETS_OFFLINE: 1
  HF_EVALUATE_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1
  VLLM_USE_MODELSCOPE: false
  LMDEPLOY_USE_MODELSCOPE: false
  HF_HUB_OFFLINE: 1
  CONDA_PATH: /mnt/shared-storage-user/opencompass-shared/qa-llm-cicd/miniconda3
  REPORT_ROOT: /mnt/shared-storage-user/opencompass-shared/qa-llm-cicd/eval_report/prtest
  # Baseline for the full-subset, three-suite mock API contract.
  BASELINE_DIR: mock-api-baseline-new
  COMPASS_DATA_CACHE: /mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/compass_data_cache
  HF_DATASETS_CACHE: /mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/hf_cache
  LMUData: /mnt/shared-storage-user/auto-eval-pipeline/vlmeval/LMUData
  HF_HUB_CACHE: /mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub
  KUBEBRAIN_CLUSTER_ENTRY: https://h.pjlab.org.cn
  # Must match rjob --namespace below (used by submit/get/logs/stop).
  KUBEBRAIN_NAMESPACE: ailab-llmeval
  SCORE_MIN: '80'
  SCORE_MAX: '90'

jobs:
  cmd_test:
    runs-on: yidian_cu12
    timeout-minutes: 45
    env:
      JOB_NAME: pr-test-${{ github.run_id }}-cmd-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Prepare - Install opencompass
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          python3 -m pip uninstall opencompass -y
          python3 -m pip install .[full]
          conda info --envs
          pip list
          lmdeploy check_env
      - name: Run test
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          pip list
          NS=${{ env.KUBEBRAIN_NAMESPACE }}
          rjob submit --metadata-name=${{ env.JOB_NAME }} --charged-group=llmeval_gpu --private-machine=group --group=llmeval_gpu --namespace=${NS} --gpu=2 --cpu=32 --memory=32568 --private-machine=group --image=registry.h.pjlab.org.cn/ailab-puyu/xpuyu:torch-2.6.0-45d96d5f-0607 --env=COMPASS_DATA_CACHE=/mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/compass_data_cache --env=TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/share_tiktoken --env=HF_ENDPOINT=https://hf-mirror.com --env=HF_DATASETS_CACHE=${{env.HF_DATASETS_CACHE}} --env=HF_HUB_CACHE=/mnt/shared-storage-user/large-model-center-share-weights/hf_hub --env=CUDA_MODULE_LOADING=EAGER --env=HF_DATASETS_OFFLINE=1 --env=TRANSFORMERS_OFFLINE=1 --env=HF_EVALUATE_OFFLINE=1 --env=HF_HUB_OFFLINE=1 --mount=gpfs://gpfs1/qa-llm-cicd:/mnt/shared-storage-user/qa-llm-cicd --mount=gpfs://gpfs1/opencompass-shared:/mnt/shared-storage-user/opencompass-shared --mount=gpfs://gpfs1/auto-eval-pipeline:/mnt/shared-storage-user/auto-eval-pipeline --mount=gpfs://gpfs1/large-model-center-share-weights:/mnt/shared-storage-user/large-model-center-share-weights -- bash -exc 'OUT="${{env.REPORT_ROOT}}/${{ github.run_id }}"; set +e; /mnt/shared-storage-user/opencompass-shared/qa-llm-cicd/pr_test_new.sh "$OUT"; status=$?; chmod -R a+rwX "$OUT" 2>/dev/null || true; exit $status'

          for i in {1..300}; do
            current_status=$(rjob get --namespace=${NS} ${{ env.JOB_NAME }} | grep -oP 'rjob [^:]+: \K[^ ]+' || true)
            if [[ $current_status == "Succeeded" ]]; then
              echo "Task succeeded"
              rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 100
              exit 0
            elif [[ $current_status == "Failed" || $current_status == "Stopped" ]]; then
              echo "Task failed or stopped, fetching logs"
              rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 100
              exit 1
            fi
            sleep 6
          done
          echo "Timed out waiting for rjob ${{ env.JOB_NAME }} (last status=${current_status:-unknown})"
          rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 100 || true
          exit 1
      - name: Get result
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          python autotest/utils/check_cmd_scores.py \
            "${{env.REPORT_ROOT}}/${{ github.run_id }}" \
            --min "${{env.SCORE_MIN}}" \
            --max "${{env.SCORE_MAX}}"
      - name: Cleanup output on success
        run: |
          # Only delete this job's outputs; keep sibling mock_api_test dirs under the same run_id.
          RUN_DIR="${{env.REPORT_ROOT}}/${{ github.run_id }}"
          for d in "$RUN_DIR"/regression_result{1,2,3}; do
            if [[ -d "$d" ]]; then
              echo "Removing successful cmd output: $d"
              rm -rf "$d"
            fi
          done
          rmdir "$RUN_DIR" 2>/dev/null || true
      - name:  Uninstall opencompass
        if: always()
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          python3 -m pip uninstall opencompass -y
          conda info --envs
          rjob stop --namespace=${{ env.KUBEBRAIN_NAMESPACE }} ${{ env.JOB_NAME }}

  mock_api_test:
    runs-on: yidian_cu12
    timeout-minutes: 360
    env:
      JOB_NAME: pr-test-${{ github.run_id }}-api-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Prepare - Install opencompass
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          python3 -m pip uninstall opencompass -y
          python3 -m pip install .[full]
          conda info --envs
          pip list
          lmdeploy check_env
      - name: Run test
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          pip list
          NS=${{ env.KUBEBRAIN_NAMESPACE }}

          rjob submit \
            --metadata-name=${{ env.JOB_NAME }} \
            --charged-group=llmeval_gpu \
            --private-machine=group \
            --group=llmeval_gpu \
            --namespace=${NS} \
            --gpu=0 \
            --cpu=34 \
            --memory=130272 \
            --image=registry.h.pjlab.org.cn/ailab-puyu-puyu_gpu/lmdeploy:v0.12.0-cu12.8 \
            --env=COMPASS_DATA_CACHE=/mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/compass_data_cache \
            --env=TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/auto-eval-pipeline/opencompass/llmeval/share_tiktoken \
            --env=HF_ENDPOINT=https://hf-mirror.com \
            --env=HF_DATASETS_CACHE=${{env.HF_DATASETS_CACHE}} \
            --env=HF_HUB_CACHE=/mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub \
            --env=HF_DATASETS_OFFLINE=1 \
            --env=TRANSFORMERS_OFFLINE=1 \
            --env=HF_EVALUATE_OFFLINE=1 \
            --env=HF_HUB_OFFLINE=1 \
            --env=LMUData=/mnt/shared-storage-user/auto-eval-pipeline/vlmeval/LMUData \
            --env=REPORT_ROOT=${{env.REPORT_ROOT}} \
            --env=REPORT_DIR=${{env.REPORT_ROOT}} \
            --env=RUN_ID=${{github.run_id}} \
            --env=GITHUB_WORKSPACE=${{github.workspace}} \
            --env=MOCK_API_PORT=26333 \
            --mount=gpfs://gpfs1/qa-llm-cicd:/mnt/shared-storage-user/qa-llm-cicd \
            --mount=gpfs://gpfs1/opencompass-shared:/mnt/shared-storage-user/opencompass-shared \
            --mount=gpfs://gpfs1/auto-eval-pipeline:/mnt/shared-storage-user/auto-eval-pipeline \
            --mount=gpfs://gpfs2/gpfs2-shared-public:/mnt/shared-storage-gpfs2/gpfs2-shared-public \
            -- bash -exc 'source ${{env.CONDA_PATH}}/bin/activate; conda activate ${{env.CONDA_ENV}}; conda env list; cd ${{github.workspace}}; bash .github/scripts/run_mock_api_tests.sh'

          for i in {1..3500}; do
            current_status=$(rjob get --namespace=${NS} ${{ env.JOB_NAME }} | grep -oP 'rjob [^:]+: \K[^ ]+' || true)
            if [[ $current_status == "Succeeded" ]]; then
              echo "Task succeeded"
              rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 500
              exit 0
            elif [[ $current_status == "Failed" || $current_status == "Stopped" ]]; then
              echo "Task failed or stopped, fetching logs"
              rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 500
              exit 1
            fi
            sleep 6
          done
          echo "Timed out waiting for rjob ${{ env.JOB_NAME }} (last status=${current_status:-unknown})"
          rjob logs job --namespace=${NS} ${{ env.JOB_NAME }} -n 500 || true
          exit 1
      - name: Compare predictions with baseline
        if: always()
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          set +e
          overall_status=0
          for func_type in chat_obj_fullbench chat_sub_fullbench chat_longtext_fullbench; do
            CURRENT="${{env.REPORT_ROOT}}/${{ github.run_id }}/$func_type"
            BASELINE="${{env.REPORT_ROOT}}/${{env.BASELINE_DIR}}/$func_type"
            echo "Current run: $CURRENT"
            echo "Baseline:    $BASELINE"
            STATUS_FILE="${{env.REPORT_ROOT}}/${{ github.run_id }}/mock_api_logs/${func_type}.status"
            if [[ ! -f "$STATUS_FILE" || "$(<"$STATUS_FILE")" != 0 ]]; then
              echo "Suite $func_type did not finish successfully; see Run test and mock_api_logs/${func_type}.log for the original error."
              overall_status=1
              continue
            fi
            if [[ ! -d "$CURRENT" || ! -d "$BASELINE" ]]; then
              echo "Missing current output or baseline for $func_type"
              overall_status=1
              continue
            fi
            for artifact in predictions results summary; do
              python autotest/utils/compare_results.py compare_results \
                "$CURRENT" "$BASELINE" "$artifact"
              if [[ $? -ne 0 ]]; then
                overall_status=1
              fi
            done
          done
          exit "$overall_status"
      - name: Cleanup output on success
        if: success()
        run: |
          BASELINE_ROOT="${{env.REPORT_ROOT}}/${{env.BASELINE_DIR}}"
          for func_type in chat_obj_fullbench chat_sub_fullbench chat_longtext_fullbench; do
            CURRENT="${{env.REPORT_ROOT}}/${{ github.run_id }}/$func_type"
            # Safety: never touch the golden baseline.
            if [[ "$CURRENT" == "$BASELINE_ROOT" || "$CURRENT" == "$BASELINE_ROOT"/* ]]; then
              echo "Refusing to delete baseline path: $CURRENT"
              exit 1
            fi
            if [[ -d "$CURRENT" ]]; then
              echo "Removing successful mock output: $CURRENT"
              rm -rf "$CURRENT"
            fi
          done
          rm -rf "${{env.REPORT_ROOT}}/${{ github.run_id }}/mock_api_logs"
          for func_type in chat_obj_fullbench chat_sub_fullbench chat_longtext_fullbench; do
            rm -f "${{env.REPORT_ROOT}}/${{ github.run_id }}/dataset_size_${func_type}.json"
          done
          rmdir "${{env.REPORT_ROOT}}/${{ github.run_id }}" 2>/dev/null || true
      - name:  Uninstall opencompass
        if: always()
        run: |
          . ${{env.CONDA_PATH}}/bin/activate
          conda activate ${{env.CONDA_ENV}}
          python3 -m pip uninstall opencompass -y
          conda info --envs
          rjob stop --namespace=${{ env.KUBEBRAIN_NAMESPACE }} ${{ env.JOB_NAME }}
